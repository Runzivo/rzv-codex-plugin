name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Fork pull requests never run on Runzivo runners.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: rzv-ubuntu-24.04-x64-2vcpu-8gb
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          # Pinned release with its SHA-256, so CI does not depend on the Ubuntu package mirror.
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
      - name: Plugin, skills and scripts
        run: scripts/10-check.sh
      - name: Package
        run: scripts/30-package.sh
